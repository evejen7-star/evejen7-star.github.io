<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Страница-визитка</title>
<meta name="description" content="Демонстрационная страница-визитка">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root {
  color-scheme: light;
  /* значения по умолчанию = тема nails; тема из site.js переопределяет их в app.js */
  --bg: #F1F3EF; --surface: #FFFFFF; --ink: #1E2724; --muted: #55635E;
  --accent: #B0346B; --on-accent: #FFFFFF; --line: #D5DBD6; --line-strong: #98A59F;
  --font-head: "Cormorant", Georgia, serif; --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --head-weight: 700; --r: 18px; --r-s: 10px;
  --pad: 20px; --sec: 56px;
  --ring: 3px solid var(--ink);
}
@media (min-width: 768px) { :root { --pad: 32px; --sec: 88px; } }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
body.has-dock { padding-bottom: 84px; }
@media (min-width: 768px) { body.has-dock { padding-bottom: 0; } }
img { max-width: 100%; display: block; }
a { color: inherit; }
:focus-visible { outline: var(--ring); outline-offset: 3px; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: var(--pad); padding-right: var(--pad); }

h1, h2, h3 { font-family: var(--font-head); font-weight: var(--head-weight); line-height: 1.08; margin: 0; letter-spacing: var(--track, -0.01em); }
h1 { font-size: var(--h1-size, clamp(2.5rem, 9vw, 4.4rem)); }
h2 { font-size: var(--h2-size, clamp(1.9rem, 6vw, 2.7rem)); margin-bottom: 28px; }
h3 { font-size: var(--h3-size, 1.45rem); margin-bottom: 8px; }
p { margin: 0; }

/* верхняя полоска демо */
.demo { background: var(--ink); color: var(--bg); font-size: 14px; line-height: 1.4; padding: 10px 0; }
.demo p { max-width: 1040px; margin: 0 auto; padding: 0 var(--pad); }

/* первый экран: подкрашенный фон и фигурный нижний край (разный у каждой темы) */
.hero { position: relative; padding: 40px 0 calc(var(--sec) + 24px); background: color-mix(in srgb, var(--accent) 9%, var(--bg)); }
.hero + .block { border-top: 0; }
.edge { position: absolute; left: 0; right: 0; bottom: -1px; pointer-events: none; }
html[data-theme="nails"] .edge { height: 44px; background: var(--bg); border-radius: 50% 50% 0 0 / 100% 100% 0 0; }
html[data-theme="barber"] .edge { height: 14px; background: repeating-linear-gradient(135deg, var(--accent) 0 10px, var(--ink) 10px 20px); }
html[data-theme="sweets"] .edge { height: 16px; background: radial-gradient(circle at 50% 100%, var(--bg) 12px, transparent 12.5px) 0 0 / 26px 16px repeat-x; }
.hero__grid { display: grid; gap: 40px; }
.hero__tag { font-size: 1.15rem; color: var(--muted); max-width: 30ch; margin-top: 16px; }
.hero__addr { margin-top: 6px; color: var(--muted); font-size: 1rem; }
.status { display: inline-flex; align-items: center; gap: 10px; margin-top: 22px; font-weight: 600; font-size: 1rem; }
.status__dot { width: 11px; height: 11px; border-radius: 50%; background: var(--line-strong); flex: none; }
.status.is-open .status__dot { background: #1E8E4F; animation: pulse 2.4s ease-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(30,142,79,.45); } 70%, 100% { box-shadow: 0 0 0 9px rgba(30,142,79,0); } }
@media (prefers-reduced-motion: reduce) { .status.is-open .status__dot { animation: none; } html { scroll-behavior: auto; } }

.actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 54px; padding: 0 26px; border-radius: var(--r-s); border: 2px solid var(--ink);
  font: 700 1.05rem var(--font-body); text-decoration: none; cursor: pointer;
  transition: transform .12s ease, background-color .12s ease, color .12s ease;
}
.btn:active { transform: translateY(1px); }
.btn--main { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn--main:hover { filter: brightness(.92); }
.btn--alt { background: transparent; color: var(--ink); }
.btn--alt:hover { background: var(--ink); color: var(--bg); }
.hero .btn { flex: 1 1 160px; }
@media (min-width: 768px) { .hero .btn { flex: 0 0 auto; } }
.rating { margin-top: 22px; color: var(--muted); font-size: .98rem; }
.rating strong { color: var(--ink); font-size: 1.15rem; }

.top { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 26px 24px 20px; align-self: start; box-shadow: 10px 10px 0 var(--accent); }
.top h2 { font-size: 1.55rem; margin-bottom: 8px; }
.top .list__price { color: var(--accent); }

/* списки цен */
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; align-items: baseline; gap: 10px; padding: 11px 0; }
.list__name { flex: 0 1 auto; max-width: 70%; }
.list__name small { display: block; color: var(--muted); font-size: .88rem; line-height: 1.35; }
.list__dots { flex: 1 1 14px; min-width: 14px; border-bottom: 2px dotted var(--line-strong); transform: translateY(-5px); }
.list__price { flex: none; font-weight: 700; white-space: nowrap; }

section.block { padding: var(--sec) 0; border-top: 1px solid var(--line); }
#find { background: var(--surface); }
.groups { display: grid; gap: 36px; }
@media (min-width: 768px) { .groups { grid-template-columns: 1fr 1fr; gap: 56px; } }
.note { margin-top: 28px; color: var(--muted); font-size: .95rem; max-width: 60ch; }

/* работы */
.works { display: grid; gap: 10px; grid-template-columns: repeat(2, 1fr); }
@media (min-width: 768px) { .works { grid-template-columns: repeat(3, 1fr); gap: 14px; } }
.work { aspect-ratio: 4 / 5; border-radius: var(--r-tile, var(--r-s)); overflow: hidden; background: var(--ph, var(--surface)); border: 1px solid var(--line); }
.work img { width: 100%; height: 100%; object-fit: cover; }
.work--ph { display: flex; align-items: flex-end; padding: 12px; color: var(--ink); font-weight: 600; font-size: .92rem; line-height: 1.3; }
.work--ph span { background: var(--surface); padding: 4px 8px; border-radius: var(--r-s); }

/* мозаика-заглушка: одна крупная плитка акцентного цвета и плитки разных оттенков */
.works--ph { grid-auto-rows: 150px; }
@media (min-width: 768px) { .works--ph { grid-auto-rows: 200px; } }
.works--ph .work { aspect-ratio: auto; }
.works--ph .work:first-child { grid-column: span 2; background: var(--accent); border-color: transparent; padding: 18px; }
.works--ph .work:first-child span { background: none; padding: 0; color: var(--on-accent); font: var(--head-weight) clamp(1.5rem, 5vw, 2rem)/1.1 var(--font-head); max-width: 14ch; }
.works--ph .work:nth-child(3) { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); }
.works--ph .work:nth-child(5) { background: var(--ink); border-color: var(--ink); }
@media (max-width: 767px) { .works--ph .work:nth-child(6) { display: none; } }
@media (min-width: 768px) { .works--ph .work:first-child { grid-row: span 2; } }
section.block { scroll-margin-top: 48px; }

/* отзывы */
.reviews { display: grid; gap: 28px; }
@media (min-width: 768px) { .reviews { grid-template-columns: 1fr 1fr; gap: 40px; } }
.review p { font-size: 1.1rem; }
.review footer { margin-top: 10px; color: var(--muted); font-size: .95rem; }

/* как найти */
.find { display: grid; gap: 36px; }
@media (min-width: 768px) { .find { grid-template-columns: 1fr 1fr; gap: 56px; } }
.addr { font-size: 1.25rem; font-weight: 600; margin-bottom: 8px; }
.find .btn { margin-top: 20px; }
.hours { width: 100%; border-collapse: collapse; font-size: 1rem; }
.hours th, .hours td { text-align: left; padding: 9px 0; border-bottom: 1px solid var(--line); font-weight: 500; }
.hours td { text-align: right; }
.hours tr.is-today th, .hours tr.is-today td { font-weight: 800; }

/* контакты */
.contacts { background: var(--ink); color: var(--bg); }
.contacts h2 { color: var(--bg); }
.contacts p { max-width: 44ch; color: color-mix(in srgb, var(--bg) 82%, transparent); }
.phone { display: inline-block; margin-top: 22px; font: var(--head-weight) var(--phone-size, clamp(2rem, 8vw, 3rem)) var(--font-head); text-decoration: none; color: var(--bg); }
.contacts .actions { margin-top: 22px; }
.contacts .btn--alt { border-color: var(--bg); color: var(--bg); }
.contacts .btn--alt:hover { background: var(--bg); color: var(--ink); }
.contacts .btn--main { border-color: var(--accent); }
.contacts :focus-visible { outline-color: var(--bg); }

footer.credit { padding: 28px 0 36px; color: var(--muted); font-size: .9rem; line-height: 1.5; }
footer.credit a { text-underline-offset: 3px; }

/* липкая панель на телефоне */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; gap: 10px; padding: 10px var(--pad) calc(10px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--bg) 94%, transparent); border-top: 1px solid var(--line); transform: translateY(110%); transition: transform .2s ease; }
.dock.is-on { transform: none; }
.dock .btn { flex: 1; min-height: 52px; padding: 0 12px; }
@media (min-width: 768px) { .dock { display: none; } }
@media (prefers-reduced-motion: reduce) { .dock { transition: none; } }

/* служебная плашка (только локально и с ?check) */
.check { position: sticky; top: 0; z-index: 99; background: #B3261E; color: #fff; font: 600 14px/1.4 system-ui, sans-serif; padding: 10px 16px; }

@media (min-width: 900px) {
  .hero__grid { grid-template-columns: 1.15fr .85fr; gap: 64px; align-items: start; }
  .hero { padding-top: 64px; }
}
</style>
</head>
<body>
<div id="app"><noscript><p style="padding:24px">Для показа страницы нужен JavaScript.</p></noscript></div>
<script src="site.js"></script>
<script src="app.js"></script>
</body>
</html>
